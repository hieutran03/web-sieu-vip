services:
  storage:
    build: .
    container_name: vtnf-storage
    restart: unless-stopped
    env_file: .env
    environment:
      # Where the server finds the current Cloudflare quick-tunnel hostname (see server.mjs).
      TUNNEL_METRICS_URL: http://tunnel:20241
    # Only reachable from this machine: Tailscale Funnel is the public entry point.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${DATA_PATH:-./data}:/data

  # Free Cloudflare quick tunnel (*.trycloudflare.com, no account or domain): several times faster
  # than Funnel for reads. The hostname changes whenever this container restarts; the storage
  # service picks the new one up within 30 s and the site keeps working through Funnel meanwhile.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: vtnf-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://storage:8080
    depends_on:
      - storage
